```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f9;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ddd;
        }
        label { display: block; margin: 15px 0 5px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }
        button, a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            border: 0;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
        }
        button { background: #198754; color: white; }
        a { background: #6c757d; color: white; }
        .error { color: #dc3545; }
    </style>
</head>
<body>
<div class="card">
    <h1>Edit Employee</h1>

    <form th:action="@{/employees/update/{id}(id=${employee.id})}"
          th:object="${employee}" method="post">

        <label for="fullName">Full Name</label>
        <input id="fullName" type="text" th:field="*{fullName}">
        <span class="error" th:if="${#fields.hasErrors('fullName')}"
              th:errors="*{fullName}"></span>

        <label for="email">Email</label>
        <input id="email" type="text" th:field="*{email}">
        <span class="error" th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"></span>

        <label for="phone">Phone</label>
        <input id="phone" type="text" th:field="*{phone}">
        <span class="error" th:if="${#fields.hasErrors('phone')}"
              th:errors="*{phone}"></span>

        <label for="department">Department</label>
        <input id="department" type="text" th:field="*{department}">
        <span class="error" th:if="${#fields.hasErrors('department')}"
              th:errors="*{department}"></span>

        <label for="salary">Salary</label>
        <input id="salary" type="number" step="0.01"
               th:field="*{salary}">
        <span class="error" th:if="${#fields.hasErrors('salary')}"
              th:errors="*{salary}"></span>

        <button type="submit">Update Employee</button>
        <a th:href="@{/employees}">Cancel</a>
    </form>
</div>
</body>
</html>
```
