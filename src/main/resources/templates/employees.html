<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
            background: #f4f6f9;
        }
        h1, h2 { color: #243b55; }
        .card {
            background: white;
            padding: 22px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ddd;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }
        label { display: block; margin-bottom: 5px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }
        button, .btn {
            display: inline-block;
            padding: 9px 14px;
            border: 0;
            border-radius: 4px;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        .save { background: #198754; margin-top: 18px; }
        .edit { background: #0d6efd; }
        .delete { background: #dc3545; }
        .error { color: #dc3545; font-size: 14px; }
        .success {
            color: #146c43;
            background: #d1e7dd;
            padding: 12px;
            border-radius: 4px;
        }
        .alert {
            color: #842029;
            background: #f8d7da;
            padding: 12px;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 11px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th { background: #243b55; color: white; }
        .actions { display: flex; gap: 6px; align-items: center; }
        .actions form { margin: 0; }
        @media (max-width: 650px) {
            .grid { grid-template-columns: 1fr; }
            .card { overflow-x: auto; }
        }
    </style>
</head>
<body>

<h1>Employee Management System</h1>

<div class="card">
    <h2>Register Employee</h2>

    <p class="success" th:if="${successMessage}"
       th:text="${successMessage}"></p>

    <p class="alert" th:if="${errorMessage}"
       th:text="${errorMessage}"></p>

    <form th:action="@{/employees}" th:object="${employee}"
          method="post">
        <div class="grid">
            <div>
                <label for="fullName">Full Name</label>
                <input id="fullName" type="text" th:field="*{fullName}">
                <span class="error"
                      th:if="${#fields.hasErrors('fullName')}"
                      th:errors="*{fullName}"></span>
            </div>

            <div>
                <label for="email">Email</label>
                <input id="email" type="text" th:field="*{email}">
                <span class="error"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"></span>
            </div>

            <div>
                <label for="phone">Phone (10 digits)</label>
                <input id="phone" type="text" th:field="*{phone}">
                <span class="error"
                      th:if="${#fields.hasErrors('phone')}"
                      th:errors="*{phone}"></span>
            </div>

            <div>
                <label for="department">Department</label>
                <input id="department" type="text"
                       th:field="*{department}">
                <span class="error"
                      th:if="${#fields.hasErrors('department')}"
                      th:errors="*{department}"></span>
            </div>

            <div>
                <label for="salary">Salary</label>
                <input id="salary" type="number" step="0.01"
                       th:field="*{salary}">
                <span class="error"
                      th:if="${#fields.hasErrors('salary')}"
                      th:errors="*{salary}"></span>
            </div>
        </div>

        <button class="save" type="submit">Save Employee</button>
    </form>
</div>

<div class="card">
    <h2>Employee List</h2>
    <p>Total Employees: <strong th:text="${#lists.size(employees)}">0</strong></p>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}"></td>
            <td th:text="${emp.fullName}"></td>
            <td th:text="${emp.email}"></td>
            <td th:text="${emp.phone}"></td>
            <td th:text="${emp.department}"></td>
            <td th:text="${emp.salary}"></td>
            <td>
                <div class="actions">
                    <a class="btn edit"
                       th:href="@{/employees/edit/{id}(id=${emp.id})}">
                        Edit
                    </a>
                    <form th:action="@{/employees/delete/{id}(id=${emp.id})}"
                          method="post"
                          onsubmit="return confirm('Delete this employee?');">
                        <button class="delete" type="submit">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="7">No employees registered yet.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
